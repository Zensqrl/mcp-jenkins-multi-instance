version: 2
updates:
- package-ecosystem: uv
  directory: /
  schedule:
    interval: weekly
    day: monday
  commit-message:
    prefix: deps
  labels:
  - dependencies
  - python
  open-pull-requests-limit: 5
  groups: &id001
    minor-and-patch:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: docker
  directory: /docker
  schedule:
    interval: weekly
    day: monday
  commit-message:
    prefix: deps(docker)
  labels:
  - dependencies
  - docker
  open-pull-requests-limit: 5
  groups: *id001
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
  commit-message:
    prefix: deps(ci)
  labels:
  - dependencies
  - ci
  open-pull-requests-limit: 5
  groups: *id001
- package-ecosystem: docker-compose
  directory: /docker
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
  groups: *id001
